{% if user.is_authenticated %}
<div class="notif-root" data-notif-root>
    <div class="notif-bell-wrap">
        <button class="notif-bell" type="button" data-notif-bell
                aria-haspopup="true" aria-controls="notif-dropdown"
                aria-label="Bildirishnomalar">
            <span class="notif-bell-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
                </svg>
            </span>
            <span class="notif-badge" data-notif-badge hidden>0</span>
        </button>

        <div class="notif-dropdown" id="notif-dropdown" data-notif-dropdown hidden>
            <div class="notif-dropdown-head">
                <span class="notif-dropdown-title">Bildirishnomalar</span>
                <button class="notif-mark-all" type="button" data-notif-mark-all>Hammasini o‘qilgan qilish</button>
            </div>
            <ul class="notif-list" data-notif-list></ul>
            <p class="notif-empty" data-notif-empty hidden>Hozircha bildirishnoma yo‘q.</p>
        </div>
    </div>
</div>
{% endif %}
